[workspace]
members = [
    "apps/classroom",
    "crates/app-core",
    "crates/capture-macos-sck",
    "crates/classroom-config",
    "crates/codec-macos-vt",
    "crates/codec-windows-mf",
    "crates/capture-windows-dxgi",
    "crates/control-transport",
    "crates/media-core",
    "crates/media-transport",
    "crates/platform",
    "crates/protocol",
    "crates/renderer-macos",
    "crates/renderer-windows",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
netdev = "0.46"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
socket2 = "0.5"
sysinfo = { version = "=0.33.1", default-features = false, features = ["system"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
# Upstream 0.20 lacks encoderSpecification on its compression builder.
videotoolbox = { path = "vendor/videotoolbox" }

# Keep the native Windows GUI pump bounded under desktop capture/paint load.
minifb = { path = "vendor/minifb" }
