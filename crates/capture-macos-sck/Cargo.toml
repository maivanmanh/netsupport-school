[package]
name = "capture-macos-sck"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
media-core = { path = "../media-core" }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "10.0.3", features = ["macos_14_0"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry"] }

[lints]
workspace = true
